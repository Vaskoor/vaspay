<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#4f46e5" />
    <meta
      name="description"
      content="VasPay is Nepal's first agentic AI digital wallet — send &amp; receive money, scan-to-pay, bank transfers, cards, savings goals, AI spending analysis, fraud-risk detection, and budget coaching. Powered by Google Gemini."
    />
    <meta name="author" content="VasPay Team" />

    <title>VasPay — Nepal's First Agentic AI Digital Wallet</title>

    <!-- Inter typeface -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind via CDN + design-system config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: [
                'Inter',
                'system-ui',
                'Segoe UI',
                'Roboto',
                'Helvetica',
                'Arial',
                'sans-serif',
              ],
            },
            colors: {
              // Primary brand palette — indigo.
              primary: {
                50:  '#eef2ff',
                100: '#e0e7ff',
                200: '#c7d2fe',
                300: '#a5b4fc',
                400: '#818cf8',
                500: '#6366f1',
                600: '#4f46e5',
                700: '#4338ca',
                800: '#3730a3',
                900: '#312e81',
              },
              // Accent palette — violet.
              accent: {
                50:  '#f5f3ff',
                100: '#ede9fe',
                200: '#ddd6fe',
                300: '#c4b5fd',
                400: '#a78bfa',
                500: '#8b5cf6',
                600: '#7c3aed',
                700: '#6d28d9',
                800: '#5b21b6',
                900: '#4c1d95',
              },
              // Semantic success — emerald.
              success: {
                50:  '#ecfdf5',
                100: '#d1fae5',
                200: '#a7f3d0',
                300: '#6ee7b7',
                400: '#34d399',
                500: '#10b981',
                600: '#059669',
                700: '#047857',
                800: '#065f46',
                900: '#064e3b',
              },
              // Semantic danger — rose.
              danger: {
                50:  '#fff1f2',
                100: '#ffe4e6',
                200: '#fecdd3',
                300: '#fda4af',
                400: '#fb7185',
                500: '#f43f5e',
                600: '#e11d48',
                700: '#be123c',
                800: '#9f1239',
                900: '#881337',
              },
              // Semantic warning — amber.
              warning: {
                50:  '#fffbeb',
                100: '#fef3c7',
                200: '#fde68a',
                300: '#fcd34d',
                400: '#fbbf24',
                500: '#f59e0b',
                600: '#d97706',
                700: '#b45309',
                800: '#92400e',
                900: '#78350f',
              },
            },
            boxShadow: {
              'card': '0 1px 2px 0 rgba(15, 23, 42, 0.04), 0 1px 3px 0 rgba(15, 23, 42, 0.06)',
              'soft': '0 4px 12px -2px rgba(15, 23, 42, 0.08)',
              'glow': '0 0 0 1px rgba(99, 102, 241, 0.10), 0 8px 24px -4px rgba(99, 102, 241, 0.18)',
              'ring-indigo': '0 0 0 4px rgba(99, 102, 241, 0.18)',
            },
            borderRadius: {
              '2xl': '1rem',
              '3xl': '1.5rem',
            },
          },
        },
      };
    </script>

    <!-- App stylesheet (custom utilities + base layer) -->
    <link rel="stylesheet" href="/index.css" />

    <!-- Import map (esm.sh) -->
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.568.0",
    "recharts": "https://esm.sh/recharts@^3.7.0"
  }
}
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
